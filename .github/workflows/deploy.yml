name: CI/CD Pipeline & EC2 Deployment

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # 1. Backend CI: Validation, Prisma Generation & TypeScript Build
  # ──────────────────────────────────────────────────────────────────────────
  backend-ci:
    name: Backend CI (Lint, Prisma & Build)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: ./backend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate
        env:
          DATABASE_URL: 'postgresql://dummy:dummy@localhost:5432/dummy'

      - name: Compile Backend TypeScript
        run: npm run build
        env:
          NODE_ENV: test
          DATABASE_URL: 'postgresql://dummy:dummy@localhost:5432/dummy'
          REDIS_URL: 'redis://localhost:6379'
          JWT_ACCESS_SECRET: 'test-secret-at-least-32-bytes-long-123456789'
          JWT_ACCESS_EXPIRES_IN: '15m'
          REFRESH_TOKEN_EXPIRES_IN: '15d'
          CORS_ORIGIN: 'http://localhost:3000'

  # ──────────────────────────────────────────────────────────────────────────
  # 2. Frontend CI: Typecheck & Next.js Build
  # ──────────────────────────────────────────────────────────────────────────
  frontend-ci:
    name: Frontend CI (TypeScript & Next.js Build)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./frontend/app

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: ./frontend/app/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Validate TypeScript Types
        run: npx tsc --noEmit

      - name: Build Next.js Application
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NEXT_PUBLIC_API_URL: 'http://localhost:4000/'
          NEXT_PUBLIC_SOCKET_URL: 'http://localhost:4000'
          NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: 'mock-key-for-build'
          JWT_ACCESS_SECRET: 'test-secret-at-least-32-bytes-long-123456789'

  # ──────────────────────────────────────────────────────────────────────────
  # 3. Continuous Deployment to AWS EC2 (Runs only on Push to main/master)
  # ──────────────────────────────────────────────────────────────────────────
  deploy-to-ec2:
    name: Deploy to AWS EC2
    needs: [backend-ci, frontend-ci]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            set -e
            echo "🚀 Starting deployment on AWS EC2..."
            
            # Navigate to project directory
            cd ~/rapido || cd /home/ubuntu/rapido
            
            # Pull latest changes from git
            echo "📥 Pulling latest code from GitHub..."
            git fetch --all
            git reset --hard origin/main || git reset --hard origin/master
            
            # Rebuild and restart containers
            echo "🐳 Building and restarting Docker containers..."
            docker compose up -d --build
            
            # Run database migrations
            echo "🗄️ Running Prisma migrations..."
            docker compose exec -T backend npx prisma migrate deploy || true
            
            # Clean up old unused images to save disk space
            echo "🧹 Cleaning up dangling Docker images..."
            docker image prune -f
            
            echo "✅ Deployment completed successfully!"
